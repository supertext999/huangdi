<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <style>

        }

            color: #d4b886;
            margin-bottom: 16px;
            letter-spacing: 4px;
        }
        .start-page p {
            font-size: 17px;
            line-height: 1.7;
            margin-bottom: 32px;
            color: #c9b9a2;
        }
        .btn {
            padding: 14px 36px;
            background: #7c5836;
            color: #fff4e0;
            border: 1px solid #b48c58;
            border-radius: 8px;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn:hover {
            background: #94693f;
            box-shadow: 0 0 12px #b98c5270;
        }
        .btn-small{
            padding: 8px 16px;
            font-size:16px;
            margin:0 6px;
        }
        .question-wrap {
            display: none;
        }
        .progress {
            color: #d4b886;
            text-align: center;
            font-size: 16px;
            margin-bottom: 24px;
        }
        .question {
            font-size: 24px;
            color: #f0ddbc;
            line-height: 1.65;
            margin-bottom: 28px;
        }
        .option-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom:24px;
        }
        .option-item {
            padding: 14px 18px;
            border: 1px solid #6b533b;
            border-radius: 10px;
            cursor: pointer;
            font-size: 17px;
            transition: 0.25s;
        }
        .option-item:hover {
            background: rgba(145, 107, 66, 0.32);
            border-color: #b48c58;
        }
        .option-item.selected {
            background: #805c38;
            border-color: #e0b877;
        }
        .ctrl-row{
            text-align:center;
        }
        .result-page {
            display: none;
            text-align: center;
        }
        .result-page h2 {
            font-size: 30px;
            color: #e2c490;
            margin-bottom: 12px;
        }

            text-align: left;
            margin-top: 22px;

            font-size: 17px;

        }
        .result-desc .title {

            margin:12px 0 6px;
        }
        .restart-btn {
            margin-top:30px;

    </style>
</head>
<body>
<div class="container">
    <div class="card start-page" id="startPage">

        <button class="btn" onclick="startTest()">开始测试</button>
    </div>

    <div class="card question-wrap" id="questionPage">

        <div class="question" id="questionText"></div>
        <div class="option-list" id="optionBox"></div>
        <div class="ctrl-row">
            <button class="btn btn-small" onclick="prevQuestion()">上一题</button>
        </div>
    </div>

    <div class="card result-page" id="resultPage">
        <h2 id="kingName"></h2>
        <div class="result-desc">
            <div class="title">📜帝王梗简介</div>
            <div id="kingIntro"></div>
            <div class="title">🤣为什么说你像他</div>
            <div id="kingAnaly"></div>
        </div>
        <br>
        <button class="btn restart-btn" onclick="restartTest()">重新测试</button>
    </div>
</div>

// 24道两难题目，无明显好坏，适合玩梗版
const questionList = [
    {q:"你手握大权，有机会制定全新规则，你会？",o:["强力推行，不服就治","拉拢伙伴慢慢落地","先观望风险不急着动","维持原样别折腾"]},
    {q:"下属和你想法完全相反，你？",o:["直接拍板听我的","合理就采纳，不合适驳回","悄悄提防留后手","顺着对方避免吵架"]},
    {q:"一件事收益巨大，翻车代价也很重，你？",o:["直接冲，赌一把","分步测试慢慢试","安稳优先不碰","交给别人，我不背锅"]},
    {q:"你更擅长下面哪一种？",o:["开拓新地盘打江山","守住现有成果稳局面","调和大家矛盾","享受当下及时行乐"]},
    {q:"发现身边人疑似要背叛你，你？",o:["提前清理杜绝隐患","悄悄收集证据观察","假装无事维持和平","直接当面质问"]},
    {q:"长期枯燥重复的繁重工作，你？",o:["咬牙硬扛严格执行","找办法简化摸鱼","很快倦怠想找点乐子","熬一天算一天等转机"]},
    {q:"拿下巨大成就之后，你打算？",o:["继续扩张追求更高目标","休养生息守住成果","放开享受犒劳自己","担心灾祸开始焦虑"]},
    {q:"手下能人很强但是野心不小，你？",o:["限制权力严加看管","制衡约束，用好他的才干","放任选择相信对方","直接不用，避开风险"]},
    {q:"强敌压境，你的第一反应？",o:["主动出击先发制人","固守阵地等待时机","谈判求和减少损失","慌乱寄希望运气"]},
    {q:"别人对你的评价，你？",o:["不在乎，我自有主张","很在意，想留好名声","无所谓开心最重要","害怕负面评价"]},
    {q:"做重大决定你更喜欢？",o:["快刀斩乱麻马上定","多方打听反复权衡","跟着直觉走","听大多数人的意见"]},

    {q:"大势已经很难逆转，你会？",o:["奋力一搏拼死抗争","尽力修补延缓衰败","接受现实及时行乐","无力改变消沉摆烂"]},
    {q:"亲近的人和你产生利益冲突，你？",o:["以大局为重牺牲感情","尽力两全兼顾两边","优先感情放过对方","猜忌疏远对方"]},
    {q:"治理天下，你更认同？",o:["实力武力说了算","靠制度法度治理","靠人心仁德感化","人生自在最重要"]},
];

let current = 0;
let score = [0,0,0,0];
let selectedOpt = [];

const startPage = document.getElementById("startPage");
const questionPage = document.getElementById("questionPage");
const resultPage = document.getElementById("resultPage");
const progressText = document.getElementById("progressText");
const questionText = document.getElementById("questionText");
const optionBox = document.getElementById("optionBox");
const kingName = document.getElementById("kingName");
const kingIntro = document.getElementById("kingIntro");
const kingAnaly = document.getElementById("kingAnaly");

function startTest(){
    startPage.style.display = "none";
    questionPage.style.display = "block";
    loadQuestion();
}

function loadQuestion(){
    const q = questionList[current];
    progressText.innerText = `第 ${current+1} / 24 题`;
    questionText.innerText = q.q;
    optionBox.innerHTML = "";
    q.o.forEach((opt,idx)=>{
        const div = document.createElement("div");
        div.className = "option-item";
        div.innerText = opt;
        if(selectedOpt[current] === idx){
            div.classList.add("selected");
        }
        div.onclick = ()=>selectOpt(idx);
        optionBox.appendChild(div);
    })
}

function selectOpt(idx){
    selectedOpt[current] = idx;
    score[idx]++;
    // 选完自动跳下一题
    if(current < questionList.length -1){
        current++;
        loadQuestion();
    }else{
        showResult();
    }
}
function prevQuestion(){
    if(current>0){
        current--;
        loadQuestion();
    }
}

function showResult(){
    questionPage.style.display = "none";
    resultPage.style.display = "block";
    const maxS = Math.max(...score);
    let resIdx = 0;
    if(score[0]>=score[1]&&score[0]>=score[2]&&score[0]>=score[3]){
        if(score[0]>=16) resIdx = Math.random()>0.5?0:17;
        else if(score[0]>=12) resIdx = 8;
        else if(score[0]>=9) resIdx = 11;
        else resIdx = 5;
    }else if(score[1]>=score[0]&&score[1]>=score[2]&&score[1]>=score[3]){
        if(score[1]>=16) resIdx = 2;
        else if(score[1]>=12) resIdx = 4;
        else if(score[1]>=9) resIdx = 12;
        else resIdx = 1;
    }else if(score[2]>=score[0]&&score[2]>=score[1]&&score[2]>=score[3]){
        if(score[2]>=16) resIdx = 16;
        else if(score[2]>=12) resIdx = 21;
        else if(score[2]>=9) resIdx = 22;
        else resIdx = 20;
    }else{
        if(score[3]>=16) resIdx = 14;
        else if(score[3]>=12) resIdx = 10;
        else if(score[3]>=9) resIdx = 18;
        else resIdx = 24;
    }
    resIdx = Math.min(resIdx,kingList.length-1);
    const king = kingList[resIdx];
    kingName.innerText = king.name;
    kingIntro.innerText = king.intro;
    kingAnaly.innerText = king.analy;
}

function restartTest(){
    current = 0;
    score = [0,0,0,0];
    selectedOpt = [];
    resultPage.style.display = "none";
    startPage.style.display = "block";
}
</script>
</body>
</html>
