<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测一测｜你是中国古代哪位帝王</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "KaiTi", "STKaiti", "SimSun", serif;
        }
        body {
            background: #2c241b;
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 0 L100 0 L100 100 L0 100 Z' fill='none' stroke='%23594b3b' stroke-width='0.5' opacity='0.25'/%3E%3C/svg%3E");
            color: #e8ddcb;
            min-height: 100vh;
        }
        .container {
            max-width: 720px;
            margin: 0 auto;
            padding: 30px 20px;
        }
        .card {
            background: rgba(48, 38, 28, 0.85);
            border: 2px solid #8b6b49;
            border-radius: 14px;
            padding: 32px;
            box-shadow: 0 0 22px rgba(0,0,0,0.45);
        }
        .start-page {
            text-align: center;
        }
        .start-page h1 {
            font-size: 34px;
            color: #d4b886;
            margin-bottom: 16px;
            letter-spacing: 4px;
        }
        .start-page p {
            font-size: 17px;
            line-height: 1.7;
            margin-bottom: 32px;
            color: #c9b9a2;
        }
        .btn {
            padding: 14px 36px;
            background: #7c5836;
            color: #fff4e0;
            border: 1px solid #b48c58;
            border-radius: 8px;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn:hover {
            background: #94693f;
            box-shadow: 0 0 12px #b98c5270;
        }
        .question-wrap {
            display: none;
        }
        .progress {
            color: #d4b886;
            text-align: center;
            font-size: 16px;
            margin-bottom: 24px;
        }
        .question {
            font-size: 24px;
            color: #f0ddbc;
            line-height: 1.65;
            margin-bottom: 28px;
        }
        .option-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .option-item {
            padding: 14px 18px;
            border: 1px solid #6b533b;
            border-radius: 10px;
            cursor: pointer;
            font-size: 17px;
            transition: 0.25s;
        }
        .option-item:hover {
            background: rgba(145, 107, 66, 0.32);
            border-color: #b48c58;
        }
        .option-item.selected {
            background: #805c38;
            border-color: #e0b877;
        }
        .result-page {
            display: none;
            text-align: center;
        }
        .result-page h2 {
            font-size: 30px;
            color: #e2c490;
            margin-bottom: 12px;
        }
        .result-desc {
            text-align: left;
            margin-top: 22px;
            line-height: 1.8;
            font-size: 17px;
            color: #ddceb6;
        }
        .result-desc .title {
            color: #e6c894;
            font-size: 19px;
            margin:12px 0 6px;
        }
        .restart-btn {
            margin-top:30px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card start-page" id="startPage">
        <h1>测一测｜你是哪位古代帝王</h1>
        <p>从秦皇到清帝，有雄主、庸君、昏君。凭第一直觉选择，看看你的帝王命格！共24题</p>
        <button class="btn" onclick="startTest()">开始测试</button>
    </div>

    <div class="card question-wrap" id="questionPage">
        <div class="progress" id="progressText">第 1 / 24 题</div>
        <div class="question" id="questionText"></div>
        <div class="option-list" id="optionBox"></div>
    </div>

    <div class="card result-page" id="resultPage">
        <h2 id="kingName"></h2>
        <div class="result-desc">
            <div class="title">帝王简介</div>
            <div id="kingIntro"></div>
            <div class="title">为什么你像他</div>
            <div id="kingAnaly"></div>
        </div>
        <button class="btn restart-btn" onclick="restartTest()">重新测试</button>
    </div>
</div>

<script>
// 25位皇帝

    {
        name:"崇祯 朱由检",

    },
    {
        name:"咸丰 奕詝",
        intro:"清朝最后一位实权皇帝，内忧外患，体弱消沉，无力挽救王朝颓势。",
        analy:"压力来临时容易疲惫消沉，想努力但常常觉得力不从心，容易悲观内耗。"

// 24道题目，4个选项 A B C D
const questionList = [
    {q:"你有一个机会开创全新规则，你会？",o:["果断推行，强力落地","先拉拢伙伴，慢慢布局","观望看看风险，不着急","维持现状，别折腾"]},
    {q:"团队里有人和你意见相反，你？",o:["直接压下，按我的来","耐心听，合理就采纳","暗中提防，留一手","顺着对方，避免吵架"]},
    {q:"有一件大事，收益极高但风险巨大，你？",o:["放手一搏，赌一把","谨慎规划，分步试错","不想碰，安稳优先","交给别人，我不担责"]},
    {q:"你更擅长哪一种？",o:["开拓新领域，打江山","守好现有局面，稳根基","调和人际关系","享受生活，及时行乐"]},
    {q:"发现身边人可能背叛你，你？",o:["提前清除，不留隐患","暗中观察收集证据","假装不知道，维持和平","直接质问，看对方说辞"]},
    {q:"长期枯燥重复的工作，你？",o:["咬牙坚持，严格执行","能偷懒就找轻松办法","容易倦怠，想找点乐子","慢慢熬，等着转机"]},
    {q:"你取得巨大成功之后，会？",o:["继续扩张，追求更高目标","守住成果，休养生息","享受成果，放松自己","担心灾祸，开始焦虑"]},
    {q:"手下有能干但野心大的人，你？",o:["限制权力，严加看管","善用其才，制衡约束","放任不管，相信对方","直接不用，避免麻烦"]},
    {q:"面对强敌压境，第一反应？",o:["主动出击先发制人","固守阵地等待时机","求和谈判减少损失","慌乱，寄希望运气"]},
    {q:"别人对你的评价，你？",o:["不在乎，我自有主张","很在意，希望留下好名声","无所谓，开心最重要","害怕负面评价"]},
    {q:"你更喜欢哪种决策方式？",o:["快刀斩乱麻，立刻定","多方打听，反复权衡","跟着直觉走","听多数人的意见"]},
    {q:"需要花钱办成大事，你？",o:["不惜代价，优先目标","精打细算，控制成本","舍不得投入，尽量省钱","有钱就花，没钱再说"]},
    {q:"被人欺骗辜负之后，你？",o:["记仇，不再信任同类人","吸取教训，提高警惕","很难释怀，容易心软原谅","自我怀疑，觉得是自己问题"]},
    {q:"空闲的时候，你更愿意？",o:["研究正事谋划未来","读书练字发展爱好","和朋友玩乐放松","独自发呆休息"]},
    {q:"一件事失败了，你会？",o:["归咎外部，重整旗鼓","复盘自己哪里做错","逃避，不想再提起","焦虑自责，反复内耗"]},
    {q:"管理一群人，你偏向？",o:["严刑约束，赏罚分明","宽厚包容，以德服人","平衡各方，和稀泥","很少管，放任自流"]},
    {q:"有机会打破传统旧规矩，你？",o:["大胆革新，破旧立新","小修小补，不做大改","尽量遵循古制","反感变动，害怕混乱"]},
    {q:"同时很多麻烦涌过来，你？",o:["逐个强力解决","分清主次慢慢处理","优先躲开麻烦","手忙脚乱很焦虑"]},
    {q:"你容易相信别人吗？",o:["很难相信任何人","看人，有选择信任","很容易相信别人","表面信任内心提防"]},
    {q:"为长远目标，能不能忍受当下痛苦？",o:["完全可以，忍常人不能忍","可以，但有底线","很难，不想委屈自己","看能得到多少回报"]},
    {q:"你对待名声的态度？",o:["名声不重要，成事优先","爱惜羽毛，不想留骂名","名声是身外之物","害怕被人唾骂"]},
    {q:"如果时代大势已经很难逆转，你？",o:["奋力一搏拼死抗争","尽力修补延缓衰败","接受现实及时行乐","无力改变，陷入消沉"]},
    {q:"和亲近的人产生利益冲突，你？",o:["以大局为重，牺牲感情","想办法两全兼顾","优先感情，放过对方","猜忌防备，疏远对方"]},
    {q:"你更认同？",o:["强者靠武力和实力说话","治理靠制度和法度","治理靠人心仁德","人生重在自在随心"]},
];

let current = 0;
let score = [0,0,0,0];
let selectedOpt = [];

const startPage = document.getElementById("startPage");
const questionPage = document.getElementById("questionPage");
const resultPage = document.getElementById("resultPage");
const progressText = document.getElementById("progressText");
const questionText = document.getElementById("questionText");
const optionBox = document.getElementById("optionBox");
const kingName = document.getElementById("kingName");
const kingIntro = document.getElementById("kingIntro");
const kingAnaly = document.getElementById("kingAnaly");

function startTest(){
    startPage.style.display = "none";
    questionPage.style.display = "block";
    loadQuestion();
}

function loadQuestion(){
    const q = questionList[current];
    progressText.innerText = `第 ${current+1} / 24 题`;
    questionText.innerText = q.q;
    optionBox.innerHTML = "";
    q.o.forEach((opt,idx)=>{
        const div = document.createElement("div");
        div.className = "option-item";
        div.innerText = opt;
        if(selectedOpt[current] === idx){
            div.classList.add("selected");
        }
        div.onclick = ()=>selectOpt(idx);
        optionBox.appendChild(div);
    })
}

function selectOpt(idx){
    selectedOpt[current] = idx;
    score[idx]++;
    if(current < questionList.length -1){
        current++;
        loadQuestion();
    }else{
        showResult();
    }
}

function showResult(){
    questionPage.style.display = "none";
    resultPage.style.display = "block";
    // 按分数加权匹配25个帝王
    const maxS = Math.max(...score);
    let resIdx = 0;
    if(score[0]>=score[1]&&score[0]>=score[2]&&score[0]>=score[3]){
        if(score[0]>=16) resIdx = Math.random()>0.5?0:17;
        else if(score[0]>=12) resIdx = 8;
        else if(score[0]>=9) resIdx = 11;
        else resIdx = 5;
    }else if(score[1]>=score[0]&&score[1]>=score[2]&&score[1]>=score[3]){
        if(score[1]>=16) resIdx = 2;
        else if(score[1]>=12) resIdx = 4;
        else if(score[1]>=9) resIdx = 12;
        else resIdx = 1;
    }else if(score[2]>=score[0]&&score[2]>=score[1]&&score[2]>=score[3]){
        if(score[2]>=16) resIdx = 16;
        else if(score[2]>=12) resIdx = 21;
        else if(score[2]>=9) resIdx = 22;
        else resIdx = 20;
    }else{
        if(score[3]>=16) resIdx = 14;
        else if(score[3]>=12) resIdx = 10;
        else if(score[3]>=9) resIdx = 18;
        else resIdx = 24;
    }
    // 兜底防止越界
    resIdx = Math.min(resIdx,kingList.length-1);
    const king = kingList[resIdx];
    kingName.innerText = king.name;
    kingIntro.innerText = king.intro;
    kingAnaly.innerText = king.analy;
}

function restartTest(){
    current = 0;
    score = [0,0,0,0];
    selectedOpt = [];
    resultPage.style.display = "none";
    startPage.style.display = "block";
}
</script>
</body>
</html>
